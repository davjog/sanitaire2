// ══ HELPERS ══════════════════════════════════════════════════════
function addDays(dateStr, days) {
  if (!dateStr || !days) return "";
  const d = new Date(dateStr);
  d.setDate(d.getDate() + parseInt(days, 10));
  return d.toISOString().split("T")[0];
}
const JOURS_SEMAINE = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
function formatDateAvecJour(d) {
  if (!d) return "—";
  const [y,m,j] = d.split("-");
  return `${JOURS_SEMAINE[new Date(d).getDay()]} ${j}/${m}/${y}`;
}
function formatDate(d) {
  if (!d) return "—";
  const [y,m,j] = d.split("-");
  return `${j}/${m}/${y}`;
}

// Date représentative d'une fiche : la date de la fiche si renseignée, sinon la date de début la plus récente de ses traitements
function dateFiche(r) {
  if (r.date) return r.date;
  const trts = (r.traitements && r.traitements.length > 0) ? r.traitements : [r];
  const dates = trts.map(t => t.dateDebut).filter(Boolean).sort();
  return r.dateDebut || (dates.length ? dates[dates.length - 1] : "");
}

// Horodatage de modif normalisé : updatedAt, sinon dérivé de l'id (= instant de création), déterministe.
function tsRecord(r) {
  if (r.updatedAt) return r.updatedAt;
  const n = Math.floor(r.id);
  return (r.id != null && !isNaN(n)) ? new Date(n).toISOString() : new Date(0).toISOString();
}

// Fusion de deux ensembles de fiches par id.
// La version la plus récente (updatedAt) gagne ; à égalité, une suppression l'emporte.
// Les fiches supprimées sont conservées comme « pierres tombales » (deleted:true) pour ne pas réapparaître.
function mergeRecords(local, remote) {
  const map = new Map();
  const consider = rec => {
    if (!rec || rec.id == null) return;
    const norm = { ...rec, updatedAt: tsRecord(rec) };
    const ex = map.get(rec.id);
    if (!ex) { map.set(rec.id, norm); return; }
    if (norm.updatedAt > ex.updatedAt || (norm.updatedAt === ex.updatedAt && norm.deleted && !ex.deleted)) {
      map.set(rec.id, norm);
    }
  };
  (local || []).forEach(consider);
  (remote || []).forEach(consider);
  return [...map.values()];
}

// Signature d'un ensemble de fiches (id + date de modif + tombstone) pour détecter les différences.
function sigRecords(arr) {
  return (arr || []).map(r => `${r.id}:${tsRecord(r)}:${r.deleted ? 1 : 0}`).sort().join("|");
}

// Calcul délai max sur l'ensemble des traitements d'une fiche
function calcDelaisMax(record) {
  const trts = (record.traitements && record.traitements.length > 0)
    ? record.traitements
    : [record]; // compat anciens records sans traitements[]
  let maxL = null, maxV = null, joursL = 0, joursV = 0;
  let momL = "matin", momV = "matin";
  trts.forEach(t => {
    const base = t.dateFin || t.dateDebut;
    if (!base) return;
    if (t.joursAttenteL) {
      const fin = new Date(addDays(base, t.joursAttenteL));
      if (!maxL || fin > maxL) { maxL = fin; joursL = parseInt(t.joursAttenteL); momL = t.momentAttenteL || "matin"; }
    }
    if (t.joursAttenteV) {
      const fin = new Date(addDays(base, t.joursAttenteV));
      if (!maxV || fin > maxV) { maxV = fin; joursV = parseInt(t.joursAttenteV); momV = t.momentAttenteV || "matin"; }
    }
  });
  return {
    dateAttenteL: maxL ? maxL.toISOString().split("T")[0] : "",
    dateAttenteV: maxV ? maxV.toISOString().split("T")[0] : "",
    joursAttenteL: joursL, joursAttenteV: joursV,
    momentAttenteL: momL, momentAttenteV: momV,
  };
}

function StatusBadge({ record }) {
  const today = new Date(); today.setHours(0,0,0,0);
  const { dateAttenteL, dateAttenteV } = calcDelaisMax(record);
  const dL = dateAttenteL ? new Date(dateAttenteL) : null;
  const dV = dateAttenteV ? new Date(dateAttenteV) : null;
  const ok = (!dL || today > dL) && (!dV || today > dV);
  return ok
    ? <span style={{background:"#d4edda",color:"#1a5c2a",borderRadius:20,padding:"3px 12px",fontSize:11,fontWeight:700,letterSpacing:1,whiteSpace:"nowrap"}}>✓ LIBÉRÉ</span>

// Zone photo (bouton fichier + caméra)
function PhotoDropZone({ onImage }) {
  const inputRef = useRef(null);
  const camRef = useRef(null);
  const process = file => {
    if (!file||!file.type.startsWith("image/")) return;
    const r = new FileReader();
    r.onload = ev => onImage(ev.target.result);
    r.readAsDataURL(file);
  };
  const handleChange = e => { process(e.target.files[0]); e.target.value=""; };
  return (
    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
      <input ref={inputRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleChange}/>
      <button type="button" onClick={()=>inputRef.current?.click()}
        style={{flex:1,padding:"10px",borderRadius:8,border:"2px dashed #b8d8b8",background:"#f7fbf7",cursor:"pointer",fontFamily:"sans-serif",fontSize:13,color:"#2d5a27",fontWeight:600}}>
        🖼️ Galerie / Fichier
      </button>
      <input ref={camRef} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handleChange}/>
      <button type="button" onClick={()=>camRef.current?.click()}
        style={{flex:1,padding:"10px",borderRadius:8,border:"2px solid #d4e8d4",background:"#e8f5e9",cursor:"pointer",fontFamily:"sans-serif",fontSize:13,color:"#1a3a1a",fontWeight:600}}>
        📷 Appareil photo
      </button>
    </div>
  );
}

// Toast notification
function Toast({ msg, type, onClose }) {
  useEffect(() => { const t = setTimeout(onClose, 4000); return () => clearTimeout(t); }, []);
  const bg = type==="success"?"#2d5a27":type==="loading"?"#1565c0":"#c62828";
  return (
    <div style={{position:"fixed",bottom:24,right:24,zIndex:999,background:bg,color:"#fff",borderRadius:12,padding:"14px 20px",fontFamily:"sans-serif",fontSize:14,fontWeight:600,boxShadow:"0 4px 24px #0003",display:"flex",alignItems:"center",gap:10,maxWidth:340}}>
      <span>{type==="loading"?"⏳":type==="success"?"✓":"✕"}</span><span>{msg}</span>
    </div>
  );
}

// ══ MODAL IMPRESSION ═════════════════════════════════════════════
function PrintModal({ records, onClose }) {
  const today = new Date().toISOString().split("T")[0];
  const allDates = records.map(r=>r.dateDebut||((r.traitements||[])[0]?.dateDebut||"")).filter(Boolean).sort();
  const firstDay = allDates.length>0 ? allDates[0] : today;
  const [du, setDu] = useState(firstDay);
  const [au, setAu] = useState(today);
  const [filterVache, setFilterVache] = useState("");
  const [filterAnnee, setFilterAnnee] = useState("");

  const anneesDispos = [...new Set(records.map(r=>(dateFiche(r)||"").split("-")[0]).filter(Boolean))].sort((a,b)=>b-a);
  const vachesDispos = [...new Set(records.map(r=>r.nomVache).filter(Boolean))].sort();

  const filtered = records.filter(r=>{
    const d = dateFiche(r);
    const annee = (d||"").split("-")[0];
    if (du && d && d < du) return false;
    if (au && d && d > au) return false;
    if (filterVache && r.nomVache !== filterVache) return false;
    if (filterAnnee && annee !== filterAnnee) return false;
    return true;
  }).sort((a,b)=>{
    const da=dateFiche(a), db=dateFiche(b);
    return da.localeCompare(db)||((a.nomVache||"").localeCompare(b.nomVache||""));
  });

  const selSt = {width:"100%",padding:"8px 10px",borderRadius:8,border:"2px solid #d4e8d4",fontSize:13,fontFamily:"sans-serif",color:"#1a3a1a",background:"#f7fbf7",outline:"none",boxSizing:"border-box"};

      .med{font-weight:600;color:#2d5a27}

      @media print{body{margin:8px}@page{margin:12mm}}

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14}}>
            <div>
              <label style={lblSt}>🐄 Vache</label>

function MenuPanel({ open, onClose, vaches, records, lastSaved, githubLoading, onGithubSave, onGithubRestore, onPrint, onStats, onManageToken, onImportVaches, onImportSauvegarde }) {

  const handleCSV = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const text = ev.target.result;
      const lines = text.split(/\r?\n/).filter(Boolean);
      const sep = lines[0].includes(";") ? ";" : ",";
      const headers = lines[0].split(sep).map(h=>h.replace(/[="]/g,"").trim().toLowerCase());
      const nomIdx = headers.findIndex(h=>h.includes("nom"));
      const numIdx = headers.findIndex(h=>h==="n°"||h.startsWith("n°")||h==="numero"||h.includes("national"));
      const travailIdx = headers.findIndex(h=>h.includes("travail"));
      const naissIdx = headers.findIndex(h=>h.includes("naissance")||h.includes("né"));
      if (nomIdx===-1){alert("Colonne 'Nom' introuvable.");return;}
      const parsed = lines.slice(1).map(line=>{
        const cols=line.split(sep).map(c=>c.replace(/[="]/g,"").trim());
        return {nom:(cols[nomIdx]||"").toUpperCase(),numero:numIdx>=0?cols[numIdx]:"",travail:travailIdx>=0?cols[travailIdx]:"",naissance:naissIdx>=0?cols[naissIdx]:""};
      }).filter(v=>v.nom&&v.nom!=="NAN"&&v.nom.length>1);
      onImportVaches(parsed);onClose();
    };
    reader.readAsText(file,"latin-1");
    e.target.value="";
  };

  const handleJSON = e => {
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{const d=JSON.parse(ev.target.result);if(d.records)setPendingImport(d.records);else alert("Format invalide.");}
      catch{alert("Fichier JSON invalide.");}
    };
    reader.readAsText(file);e.target.value="";
  };

  const downloadJSON = () => {
    const blob=new Blob([JSON.stringify({version:2,savedAt:new Date().toISOString(),records},null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`carnet-${new Date().toISOString().slice(0,10)}.json`;a.click();
  };
  const downloadCSV = () => {
    const rows=vaches.map(v=>`${v.nom};${v.numero};${v.travail};${v.naissance}`);

          <div onClick={()=>setPendingImport(null)} style={{position:"absolute",inset:0,background:"#0008"}}/>
          <div style={{position:"relative",background:"#fff",borderRadius:16,padding:24,width:320,maxWidth:"95vw",boxShadow:"0 8px 40px #0004"}}>
            <div style={{fontWeight:900,fontSize:17,color:"#c62828",fontFamily:"sans-serif",marginBottom:10}}>⚠️ Confirmer l'importation</div>
            <div style={{fontSize:13,color:"#555",fontFamily:"sans-serif",marginBottom:18,lineHeight:1.6}}>
              Les données actuelles seront <strong>remplacées</strong> par celles du fichier ({pendingImport.length} fiche{pendingImport.length>1?"s":""}).
            </div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{onImportSauvegarde(pendingImport);setPendingImport(null);onClose();}}
                style={{flex:1,padding:11,borderRadius:10,border:"none",background:"#c62828",color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer",fontFamily:"sans-serif"}}>📥 Importer</button>
              <button onClick={()=>setPendingImport(null)}
                style={{padding:"11px 16px",borderRadius:10,border:"1px solid #ddd",background:"#fff",color:"#555",fontWeight:600,cursor:"pointer",fontFamily:"sans-serif"}}>Annuler</button>
            </div>
          </div>
        </div>
      )}
      <div style={{position:"relative",width:320,background:"#fff",height:"100%",boxShadow:"4px 0 32px #0003",display:"flex",flexDirection:"column",overflowY:"auto"}}>

// ══ APP PRINCIPALE ════════════════════════════════════════════════
function App() {
  const [records, setRecords] = useState([]);
  const [vaches, setVaches] = useState(VACHES_DEFAUT);
  const [showMenu, setShowMenu] = useState(false);
  const [form, setForm] = useState(emptyForm);
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [editGroupId, setEditGroupId] = useState(null);
  const [search, setSearch] = useState("");
  const [filterAnnee, setFilterAnnee] = useState("");
  const [detailId, setDetailId] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [toast, setToast] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [lastSaved, setLastSaved] = useState(null);
  const [showPrint, setShowPrint] = useState(false);
  const [showStats, setShowStats] = useState(false);
  const [githubLoading, setGithubLoading] = useState(false);
  const [showTokenModal, setShowTokenModal] = useState(false);
  const [pendingGithubAction, setPendingGithubAction] = useState(null);
  const [showRestoreConfirm, setShowRestoreConfirm] = useState(false);
  const [showAlertes, setShowAlertes] = useState(false);
  const [notifPermission, setNotifPermission] = useState(typeof Notification!=="undefined"?Notification.permission:"denied");
  const notifiedRef = useRef(new Set());
  const isLoading = useRef(true);
  const recordsRef = useRef(records);
  recordsRef.current = records; // toujours à jour → utilisé par les sauvegardes différées/flush
  const autoSaveTimer = useRef(null);
  const dirtyRef = useRef(false); // vrai quand des modifs utilisateur ne sont pas encore sur GitHub

  const showToast = (msg, type="success") => setToast({msg,type});

  // ── Persistance localStorage ──
  useEffect(() => {
    try {
      const s=localStorage.getItem("carnet-sanitaire-records");
      if(s){const p=JSON.parse(s);if(Array.isArray(p)&&p.length>0){
        const mig=p.map(r=>r.updatedAt?r:{...r,updatedAt:tsRecord(r)});
        setRecords(mig);setLastSaved(localStorage.getItem("carnet-sanitaire-savedAt")||null);
      }}
      const sv=localStorage.getItem("carnet-sanitaire-vaches");
      if(sv){const pv=JSON.parse(sv);if(Array.isArray(pv)&&pv.length>0)setVaches(pv);}
    } catch(e){}
    setTimeout(()=>{isLoading.current=false;},100);
  },[]);

  useEffect(()=>{
    if(isLoading.current)return;
    try{const now=new Date().toISOString();localStorage.setItem("carnet-sanitaire-records",JSON.stringify(records));localStorage.setItem("carnet-sanitaire-savedAt",now);setLastSaved(now);}catch(e){}
  },[records]);

  useEffect(()=>{
    if(isLoading.current)return;
    try{localStorage.setItem("carnet-sanitaire-vaches",JSON.stringify(vaches));}catch(e){}
  },[vaches]);

  // ── Données filtrées ──
  // liveRecords = fiches visibles (hors pierres tombales de suppression). records = source de vérité complète (sync).
  const liveRecords = useMemo(()=>records.filter(r=>!r.deleted),[records]);

  const anneesDispos = useMemo(()=>{
    const s=new Set(liveRecords.map(r=>(dateFiche(r)||"").split("-")[0]).filter(Boolean));
    return [...s].sort((a,b)=>b-a);
  },[liveRecords]);

  const filtered = useMemo(()=>{
    let rs=liveRecords;
    if(filterAnnee) rs=rs.filter(r=>(dateFiche(r)||"").split("-")[0]===filterAnnee);
    if(search) rs=rs.filter(r=>{
      const trts=(r.traitements&&r.traitements.length>0)?r.traitements:[r];
      return [r.nomVache,r.raison,r.date,...trts.flatMap(t=>[t.medicament,t.intervenant,t.numOrdonnance])].some(v=>v?.toString().toLowerCase().includes(search.toLowerCase()));
    });
    return [...rs].sort((a,b)=>{
      const c=dateFiche(b).localeCompare(dateFiche(a));
      return c!==0?c:(b.id||0)-(a.id||0);
    });
  },[liveRecords,search,filterAnnee]);

  // Regroupe sur une ligne les fiches créées ensemble pour plusieurs vaches (même groupId)
  const groupedFiltered = useMemo(()=>{
    const groups=[];
    const byId=new Map();
    filtered.forEach(r=>{
      if(r.groupId&&byId.has(r.groupId)){
        byId.get(r.groupId).push(r);
      } else {
        const g=[r];
        if(r.groupId)byId.set(r.groupId,g);
        groups.push(g);
      }
    });
    return groups;
  },[filtered]);

  // ── GitHub ──
  const GITHUB_USER="davjog", GITHUB_REPO="sanitaire2", GITHUB_FILE="data.json";
  const getToken=()=>localStorage.getItem("carnet-github-token")||"";

  const githubAction=action=>{
    if(action==="restore"){setShowRestoreConfirm(true);return;}
    if(!getToken()){setPendingGithubAction(action);setShowTokenModal(true);}
    else saveToGithub();
  };

  // Synchronisation GitHub : relit le distant, FUSIONNE avec le local, puis écrit l'union.
  // Gère la saisie en parallèle sur plusieurs appareils sans perte de données.
  const saveToGithub=async(token,silent=false)=>{
    const tok=token||getToken();
    if(!tok){if(!silent){setShowTokenModal(true);setPendingGithubAction("save");}return;}
    if(!silent){setGithubLoading(true);showToast("Synchronisation GitHub…","loading");}
    const URL_=`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`;
    const H={Authorization:`token ${tok}`,Accept:"application/vnd.github.v3+json"};
    try{
      let done=false;
      for(let attempt=0; attempt<4 && !done; attempt++){
        // 1. Lecture du distant (sha + fiches)
        let sha="",remoteRecs=[],remoteSaved="";
        try{
          const g=await fetch(URL_,{headers:H});
          if(g.status===401){localStorage.removeItem("carnet-github-token");throw new Error("Token invalide");}
          if(g.ok){const d=await g.json();sha=d.sha;const p=JSON.parse(decodeURIComponent(escape(atob(d.content))));if(Array.isArray(p.records))remoteRecs=p.records;remoteSaved=p.savedAt||"";}
        }catch(e){if(e.message==="Token invalide")throw e;/* fichier absent → distant vide */}

        // 2. Fusion local + distant
        const local=recordsRef.current;
        const merged=mergeRecords(local,remoteRecs);
        const sM=sigRecords(merged),sL=sigRecords(local),sR=sigRecords(remoteRecs);

        // 3a. Distant déjà à jour (contient déjà l'union) → rien à écrire
        if(sM===sR){
          if(sM!==sL) setRecords(merged); // on adopte d'éventuelles fiches distantes
          const st=remoteSaved||new Date().toISOString();
          try{localStorage.setItem("carnet-sanitaire-savedAt",st);setLastSaved(st);}catch(e){}
          dirtyRef.current=false; done=true; break;
        }

        // 3b. Écriture de l'union
        const stamp=new Date().toISOString();
        const content=btoa(unescape(encodeURIComponent(JSON.stringify({version:3,savedAt:stamp,records:merged},null,2))));
        const res=await fetch(URL_,{method:"PUT",headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({message:`Carnet sanitaire ${new Date().toLocaleDateString("fr-FR")}`,content,...(sha?{sha}:{})})});
        if(res.status===401){localStorage.removeItem("carnet-github-token");throw new Error("Token invalide");}
        if(res.status===409||res.status===422){await new Promise(r=>setTimeout(r,400+attempt*300));continue;} // conflit d'écriture → on relit et refusionne
        if(!res.ok)throw new Error("Erreur "+res.status);
        if(sM!==sL) setRecords(merged); // adopte l'union localement (fiches distantes incluses)
        try{localStorage.setItem("carnet-sanitaire-savedAt",stamp);setLastSaved(stamp);}catch(e){}
        dirtyRef.current=false; done=true;
      }
      if(!done)throw new Error("Conflit persistant — réessayez");
      showToast(silent?"🔄 Synchronisé avec GitHub":"✓ Synchronisé avec GitHub");
    }catch(e){showToast("Erreur GitHub : "+e.message,"error");}
    finally{if(!silent)setGithubLoading(false);}
  };

  const restoreFromGithub=async(token)=>{
    const tok=token||getToken();
    if(!tok){setShowTokenModal(true);setPendingGithubAction("restore");return;}
    setGithubLoading(true);showToast("Restauration GitHub en cours…","loading");
    try{
      const res=await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,{headers:{Authorization:`token ${tok}`,Accept:"application/vnd.github.v3+json"}});
      if(res.status===401){localStorage.removeItem("carnet-github-token");throw new Error("Token invalide");}
      if(!res.ok)throw new Error("Fichier introuvable");
      const d=await res.json();
      const parsed=JSON.parse(decodeURIComponent(escape(atob(d.content))));
      if(parsed.records){setRecords(parsed.records);showToast(`✓ ${parsed.records.length} fiche(s) restaurée(s)`);}
      else throw new Error("Format invalide");
    }catch(e){showToast("Erreur GitHub : "+e.message,"error");}
    finally{setGithubLoading(false);}
  };

  // ── Synchronisation auto GitHub à l'ouverture ──
  // À l'ouverture : on lance une synchro complète (relit le distant, fusionne avec le local,
  // adopte les fiches distantes et renvoie l'union). Aucune perte, même en saisie parallèle.
  const autoSyncDone=useRef(false);
  useEffect(()=>{
    if(autoSyncDone.current)return;
    autoSyncDone.current=true;
    if(!getToken())return;
    (async()=>{
      await new Promise(r=>setTimeout(r,400)); // laisse le chargement localStorage se faire d'abord
      saveToGithub(undefined,true); // pull + merge + push en une passe
    })();
  },[]);

  // ── Sauvegarde automatique GitHub après modification ──
  // Déclenchée uniquement par une action utilisateur (dirtyRef). Débounce 3 s.
  useEffect(()=>{
    if(isLoading.current)return;
    if(!dirtyRef.current)return;        // rien de neuf à envoyer
    if(!getToken())return;             // pas de token → auto-save désactivée
    if(autoSaveTimer.current)clearTimeout(autoSaveTimer.current);
    autoSaveTimer.current=setTimeout(()=>{saveToGithub(undefined,true);},3000);
  },[records]);

  // Flush : appli mise en arrière-plan avec des modifs non envoyées → sauvegarde immédiate
  useEffect(()=>{
    const onHide=()=>{
      if(document.visibilityState==="hidden"&&dirtyRef.current&&getToken()){
        if(autoSaveTimer.current)clearTimeout(autoSaveTimer.current);
        saveToGithub(undefined,true);
      }
    };
    document.addEventListener("visibilitychange",onHide);
    return ()=>document.removeEventListener("visibilitychange",onHide);
  },[]);

  // ── Alertes ──
  const alertes = useMemo(()=>{
    const today=new Date();today.setHours(0,0,0,0);
    const result=[];
    liveRecords.forEach(r=>{
      const {dateAttenteL:dL,dateAttenteV:dV,momentAttenteL:momL,momentAttenteV:momV}=calcDelaisMax(r);
      [{d:dL,type:"LAIT",icon:"🥛",color:"#1565c0",moment:momL},{d:dV,type:"VIANDE",icon:"🥩",color:"#b71c1c",moment:momV}].forEach(({d,type,icon,color,moment})=>{
        if(!d)return;
        const date=new Date(d);date.setHours(0,0,0,0);
        const diff=Math.round((date-today)/86400000);
        if(diff>=0&&diff<=3) result.push({id:r.id,vache:r.nomVache,type,icon,color,moment,quand:diff===0?"aujourd'hui":diff===1?"demain":`dans ${diff} j`,urgence:diff===0?"high":diff===1?"med":"low",date:d,diff});
      });
    });
    return result.sort((a,b)=>a.diff-b.diff||(a.vache||"").localeCompare(b.vache||""));
  },[liveRecords]);

  useEffect(()=>{
    if(notifPermission!=="granted")return;
    alertes.forEach(a=>{
      const key=`${a.id}-${a.type}-${a.date}`;
      if(notifiedRef.current.has(key))return;
      if(a.urgence==="high"||a.urgence==="med"){
        new Notification(a.urgence==="high"?`🚨 Délai ${a.type} expire AUJOURD'HUI`:`⚠️ Délai ${a.type} expire DEMAIN`,{body:`🐄 ${a.vache} — Fin d'attente ${a.type} : ${formatDateAvecJour(a.date)} ${a.moment}`,tag:key});
        notifiedRef.current.add(key);
      }
    });
  },[alertes,notifPermission]);

  // ── CRUD ──
  const handleSubmit=()=>{
    const vList=form.selectedVaches&&form.selectedVaches.length>0?form.selectedVaches:(form.nomVache?[{nom:form.nomVache,numero:form.numeroVache,travail:form.travailVache}]:[]);
    if(vList.length===0)return;
    dirtyRef.current=true;
    const now=new Date().toISOString();
    const trts=form.traitements||[];
    const dateVal=form.date||trts[0]?.dateDebut||new Date().toISOString().split("T")[0];
    if(editId!==null){
      const v=vList[0];
      setRecords(rs=>rs.map(r=>r.id===editId?{...form,nomVache:v.nom,numeroVache:v.numero,travailVache:v.travail,date:dateVal,id:editId,updatedAt:now,deleted:false}:r));
      setEditId(null);
    } else if(editGroupId!==null){
      const gid=editGroupId;
      setRecords(rs=>{
        const kept=rs.filter(r=>r.groupId!==gid);
        const fresh=vList.map(v=>{
          const rec={...form,nomVache:v.nom,numeroVache:v.numero,travailVache:v.travail,date:dateVal,id:Date.now()+Math.random(),updatedAt:now};
          if(vList.length>1)rec.groupId=gid;else delete rec.groupId;
          return rec;
        });
        return [...kept,...fresh];
      });
      setEditGroupId(null);
    } else {
      const gid=vList.length>1?Date.now()+Math.random():null;
      setRecords(rs=>[...rs,...vList.map(v=>{
        const rec={...form,nomVache:v.nom,numeroVache:v.numero,travailVache:v.travail,date:dateVal,id:Date.now()+Math.random(),updatedAt:now};
        if(gid)rec.groupId=gid;
        return rec;
      })]);
    }
    setForm(emptyForm);setShowForm(false);
  };

  const handleEdit=record=>{
    // Normalise: si pas de traitements[], migre les champs plats
    const traitements=record.traitements&&record.traitements.length>0?record.traitements:[{
      ...emptyTraitement(),
      medicament:record.medicament||"",posologie:record.posologie||"",quantite:record.quantite||"",
      voieAdmin:record.voieAdmin||"",dateDebut:record.dateDebut||"",momentDebut:record.momentDebut||"matin",
      dateFin:record.dateFin||"",momentFin:record.momentFin||"matin",
      joursAttenteL:record.joursAttenteL||"",momentAttenteL:record.momentAttenteL||"matin",
      joursAttenteV:record.joursAttenteV||"",momentAttenteV:record.momentAttenteV||"matin",
      numOrdonnance:record.numOrdonnance||"",intervenant:record.intervenant||"",
      photoOrdonnance:record.photoOrdonnance||"",
    }];
    setForm({...record,date:record.date||dateFiche(record)||new Date().toISOString().split("T")[0],traitements,selectedVaches:[{nom:record.nomVache,numero:record.numeroVache,travail:record.travailVache}]});
    setEditId(record.id);setShowForm(true);setDetailId(null);
  };
  const handleEditGroup=groupRecords=>{
    const rep=groupRecords[0];
    const traitements=rep.traitements&&rep.traitements.length>0?rep.traitements:[{
      ...emptyTraitement(),
      medicament:rep.medicament||"",posologie:rep.posologie||"",quantite:rep.quantite||"",
      voieAdmin:rep.voieAdmin||"",dateDebut:rep.dateDebut||"",momentDebut:rep.momentDebut||"matin",
      dateFin:rep.dateFin||"",momentFin:rep.momentFin||"matin",
      joursAttenteL:rep.joursAttenteL||"",momentAttenteL:rep.momentAttenteL||"matin",
      joursAttenteV:rep.joursAttenteV||"",momentAttenteV:rep.momentAttenteV||"matin",
      numOrdonnance:rep.numOrdonnance||"",intervenant:rep.intervenant||"",
      photoOrdonnance:rep.photoOrdonnance||"",
    }];
    setForm({...rep,date:rep.date||dateFiche(rep)||new Date().toISOString().split("T")[0],traitements,
      selectedVaches:groupRecords.map(r=>({nom:r.nomVache,numero:r.numeroVache,travail:r.travailVache}))});
    setEditGroupId(rep.groupId);setShowForm(true);setDetailId(null);
  };
  const handleDelete=id=>{
    dirtyRef.current=true;
    const ids=Array.isArray(id)?id:[id];
    const now=new Date().toISOString();
    // Suppression douce : on garde une « pierre tombale » pour que la suppression se propage
    // aux autres appareils et ne réapparaisse pas à la fusion.
    setRecords(rs=>rs.map(r=>ids.includes(r.id)?{...r,deleted:true,updatedAt:now}:r));
    setConfirmDelete(null);setDetailId(null);
  };

  // ── Mise à jour d'un champ d'un traitement ──
  const setTrt=(tid,field,val)=>setForm(f=>({...f,traitements:f.traitements.map(t=>t.id===tid?{...t,[field]:val}:t)}));
  const addTrt=()=>setForm(f=>({...f,traitements:[...(f.traitements||[]),emptyTraitement()]}));
  const delTrt=tid=>setForm(f=>({...f,traitements:f.traitements.filter(t=>t.id!==tid)}));

  const detail=records.find(r=>r.id===detailId);

  const inputSt={width:"100%",padding:"9px 12px",borderRadius:8,border:"2px solid #d4e8d4",fontSize:14,fontFamily:"sans-serif",color:"#1a3a1a",background:"#f7fbf7",outline:"none",boxSizing:"border-box"};
  const labelSt={display:"block",fontSize:11,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#3a5a3a",marginBottom:5,fontFamily:"sans-serif"};

  return (
    <div style={{minHeight:"100vh",background:"#f0f4f0",fontFamily:"'Georgia','Times New Roman',serif"}}>
      {toast && <Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      {showPrint && <PrintModal records={liveRecords} onClose={()=>setShowPrint(false)}/>}
      {showStats && <StatsModal records={liveRecords} onClose={()=>setShowStats(false)}/>}
      {showTokenModal && <TokenModal onClose={()=>{setShowTokenModal(false);setPendingGithubAction(null);}} onConfirm={tok=>{localStorage.setItem("carnet-github-token",tok);setShowTokenModal(false);if(pendingGithubAction==="save")saveToGithub(tok);else if(pendingGithubAction==="restore")restoreFromGithub(tok);setPendingGithubAction(null);}}/>}

      {showRestoreConfirm && (
        <div style={{position:"fixed",inset:0,zIndex:400,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
          <div onClick={()=>setShowRestoreConfirm(false)} style={{position:"absolute",inset:0,background:"#0008"}}/>
          <div style={{position:"relative",background:"#fff",borderRadius:16,padding:24,width:320,maxWidth:"95vw",boxShadow:"0 8px 40px #0004"}}>
            <div style={{fontWeight:900,fontSize:17,color:"#c62828",fontFamily:"sans-serif",marginBottom:10}}>⚠️ Confirmer la restauration</div>
            <div style={{fontSize:13,color:"#555",fontFamily:"sans-serif",marginBottom:18,lineHeight:1.6}}>Les données actuelles seront <strong>remplacées</strong> par celles de GitHub.</div>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{setShowRestoreConfirm(false);if(!getToken()){setPendingGithubAction("restore");setShowTokenModal(true);}else restoreFromGithub();}}
                style={{flex:1,padding:11,borderRadius:10,border:"none",background:"#c62828",color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer",fontFamily:"sans-serif"}}>🔄 Oui, restaurer</button>
              <button onClick={()=>setShowRestoreConfirm(false)} style={{padding:"11px 16px",borderRadius:10,border:"1px solid #ddd",background:"#fff",color:"#555",fontWeight:600,cursor:"pointer",fontFamily:"sans-serif"}}>Annuler</button>
            </div>
          </div>
        </div>
      )}

      <MenuPanel open={showMenu} onClose={()=>setShowMenu(false)} vaches={vaches} records={liveRecords} lastSaved={lastSaved}
        githubLoading={githubLoading} onGithubSave={()=>{setShowMenu(false);setTimeout(()=>githubAction("save"),50);}} onGithubRestore={()=>{setShowMenu(false);setTimeout(()=>githubAction("restore"),50);}}
        onPrint={()=>setShowPrint(true)} onStats={()=>setShowStats(true)} onManageToken={()=>{setShowMenu(false);setTimeout(()=>setShowTokenModal(true),50);}}
        onImportVaches={nv=>{setVaches(nv.sort((a,b)=>a.nom.localeCompare(b.nom)));showToast(`✓ ${nv.length} vaches importées`);}}
        onImportSauvegarde={nr=>{dirtyRef.current=true;setRecords(nr);showToast(`✓ ${nr.length} fiche(s) restaurée(s)`);}}/>

      {/* PANEL ALERTES */}
      {showAlertes && (
        <div style={{position:"fixed",top:0,right:0,bottom:0,zIndex:150,display:"flex",flexDirection:"column"}}>
          <div onClick={()=>setShowAlertes(false)} style={{position:"fixed",inset:0,background:"#0004",zIndex:-1}}/>
          <div style={{marginLeft:"auto",width:340,height:"100%",background:"#fff",boxShadow:"-4px 0 32px #0003",display:"flex",flexDirection:"column",overflowY:"auto"}}>
            <div style={{background:"linear-gradient(135deg,#1a3a1a,#2d5a27)",padding:"18px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
              <h3 style={{margin:0,color:"#fff",fontSize:17,fontWeight:900}}>🔔 Alertes délais</h3>
              <button onClick={()=>setShowAlertes(false)} style={{background:"#ffffff22",border:"none",color:"#fff",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:17}}>✕</button>
            </div>
            <div style={{padding:16,flex:1}}>
              {notifPermission!=="granted" && (
                <div style={{background:"#e8f5e9",border:"1px solid #a5d6a7",borderRadius:10,padding:"12px 14px",marginBottom:12,fontFamily:"sans-serif"}}>
                  <div style={{fontWeight:700,fontSize:13,color:"#1a3a1a",marginBottom:6}}>🔔 Activer les notifications</div>
                  <button onClick={async()=>setNotifPermission(await Notification.requestPermission())}
                    style={{background:"#2d5a27",color:"#fff",border:"none",borderRadius:7,padding:"7px 16px",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"sans-serif"}}>Autoriser</button>
                </div>
              )}
              {alertes.length===0
                ?<div style={{textAlign:"center",padding:"40px 16px",color:"#5a7a5a"}}><div style={{fontSize:40,marginBottom:10}}>✅</div><div style={{fontWeight:700,color:"#2d5a27",fontFamily:"sans-serif"}}>Aucune alerte</div></div>
                :alertes.map((a,i)=>{
                  const bgMap={high:"#fff5f5",med:"#fffdf0",low:"#f7fbf7"};
                  const bdrMap={high:"#ffcdd2",med:"#ffe082",low:"#c8e6c9"};
                  const badgeMap={high:{bg:"#ffebee",c:"#c62828",t:"AUJOURD'HUI"},med:{bg:"#fff3cd",c:"#7a4f00",t:"DEMAIN"},low:{bg:"#e8f5e9",c:"#2d5a27",t:a.quand.toUpperCase()}};
                  const badge=badgeMap[a.urgence];
                  return (
                    <div key={i} onClick={()=>{setDetailId(a.id);setShowAlertes(false);}}
                      style={{background:bgMap[a.urgence],border:`1px solid ${bdrMap[a.urgence]}`,borderRadius:10,padding:"11px 13px",marginBottom:9,cursor:"pointer"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                        <div>
                          <div style={{fontWeight:800,fontSize:14,color:"#1a3a1a",fontFamily:"sans-serif"}}>🐄 {a.vache}</div>
                          <div style={{fontSize:13,color:a.color,fontWeight:700,fontFamily:"sans-serif",marginTop:2}}>{a.icon} Délai {a.type} expire</div>
                          <div style={{fontSize:12,color:"#5a7a5a",fontFamily:"sans-serif",marginTop:3}}>📅 {formatDateAvecJour(a.date)} — {a.moment}</div>
                          {a.urgence==="high" && <div style={{marginTop:5,fontSize:11,fontWeight:700,color:"#c62828",fontFamily:"sans-serif",background:"#ffebee",borderRadius:5,padding:"2px 7px",display:"inline-block"}}>⛔ Ne pas collecter</div>}
                        </div>
                        <span style={{background:badge.bg,color:badge.c,borderRadius:20,padding:"2px 9px",fontSize:10,fontWeight:800,letterSpacing:1,textTransform:"uppercase",fontFamily:"sans-serif",flexShrink:0}}>{badge.t}</span>
                      </div>
                    </div>
                  );
                })}
            </div>
          </div>
        </div>
      )}

      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#1a3a1a 0%,#2d5a27 60%,#4a7c3f 100%)",color:"#fff",boxShadow:"0 4px 24px #0003"}}>
        <div style={{maxWidth:1180,margin:"0 auto",padding:"22px 20px 14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:16,flexWrap:"wrap"}}>
            <button onClick={()=>setShowMenu(true)} style={{background:"#ffffff22",border:"1px solid #ffffff44",color:"#fff",borderRadius:8,padding:"8px 12px",cursor:"pointer",fontSize:18,flexShrink:0}}>☰</button>
            <div style={{fontSize:42,lineHeight:1}}>🐄</div>
            <div>
              <div style={{fontSize:10,letterSpacing:4,textTransform:"uppercase",color:"#a8d5a2",fontFamily:"sans-serif"}}>Élevage bovin lait</div>
              <h1 style={{margin:0,fontSize:24,fontWeight:900,letterSpacing:-1}}>Carnet Sanitaire</h1>
              <div style={{fontSize:11,color:"#c8e6c5",fontFamily:"sans-serif"}}>Registre des traitements vétérinaires — {vaches.length} vaches</div>
            </div>
            <div style={{marginLeft:"auto",display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
              {[{n:liveRecords.length,l:"Fiches"},{n:new Set(liveRecords.map(r=>r.nomVache)).size,l:"Vaches"},{n:vaches.length,l:"Troupeau"}].map(({n,l})=>(
                <div key={l} style={{background:"#ffffff18",borderRadius:10,padding:"6px 14px",textAlign:"center",fontFamily:"sans-serif"}}>
                  <div style={{fontSize:19,fontWeight:900}}>{n}</div>
                  <div style={{fontSize:9,letterSpacing:2,textTransform:"uppercase",color:"#c8e6c5"}}>{l}</div>
                </div>
              ))}
              <button onClick={()=>setShowAlertes(o=>!o)}
                style={{position:"relative",background:alertes.length>0?"#fff3cd":"#ffffff22",border:alertes.length>0?"1px solid #f0c040":"1px solid #ffffff44",color:alertes.length>0?"#7a4f00":"#fff",borderRadius:8,padding:"7px 14px",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"sans-serif",display:"flex",alignItems:"center",gap:6}}>
                🔔{alertes.length>0&&<span style={{background:"#c62828",color:"#fff",borderRadius:20,fontSize:10,fontWeight:900,padding:"1px 6px"}}>{alertes.length}</span>}
              </button>
            </div>
          </div>
          <div style={{marginTop:12,display:"flex",gap:10,flexWrap:"wrap"}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍  Rechercher (vache, médicament, intervenant…)"
              style={{flex:1,minWidth:200,padding:"9px 14px",borderRadius:8,border:"none",fontSize:13,fontFamily:"sans-serif",background:"#ffffff22",color:"#fff",outline:"none"}}/>
            <select value={filterAnnee} onChange={e=>setFilterAnnee(e.target.value)}
              style={{padding:"9px 14px",borderRadius:8,border:"none",fontSize:13,fontFamily:"sans-serif",background:"#ffffff22",color:"#fff",outline:"none",cursor:"pointer"}}>
              <option value="" style={{color:"#1a3a1a"}}>Toutes années</option>
              {anneesDispos.map(a=><option key={a} value={a} style={{color:"#1a3a1a"}}>{a}</option>)}
            </select>
            <button onClick={()=>setShowPrint(true)}
              style={{background:"#ffffff22",color:"#fff",border:"1px solid #ffffff44",borderRadius:8,padding:"9px 16px",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"sans-serif"}}>
              🖨️ Imprimer

                  const dateStr=dateFiche(r);
                  return (
                    <tr key={r.id} onClick={()=>setDetailId(r.id)}
                      style={{background:i%2===0?"#fff":"#f7fbf7",cursor:"pointer"}}
                      onMouseEnter={e=>e.currentTarget.style.background="#e8f5e9"}
                      onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"#fff":"#f7fbf7"}>
                      <td style={{padding:"9px 11px",fontWeight:800,color:"#1a3a1a"}}>
                        🐄 {g.map(x=>x.nomVache).join(", ")}
                        {isGroup&&<span style={{marginLeft:6,background:"#e8f5e9",color:"#2d5a27",borderRadius:6,padding:"1px 7px",fontSize:11,fontWeight:800}}>×{g.length}</span>}
                      </td>
                      <td style={{padding:"9px 11px",color:"#2d5a27",fontWeight:600}}>{isGroup?"—":(r.travailVache||"—")}</td>
                      <td style={{padding:"9px 11px",whiteSpace:"nowrap"}}>
                        {dateStr&&<span style={{background:"#e8f5e9",color:"#1a3a1a",borderRadius:6,padding:"2px 8px",fontSize:12,fontWeight:700}}>{formatDate(dateStr)}</span>}
                      </td>
                      <td style={{padding:"9px 11px",color:"#555",maxWidth:120}}>{r.raison||"—"}</td>
                      <td style={{padding:"8px 10px",maxWidth:200}}>
                        {trts.map((t,ti)=>(
                          <div key={ti} style={{fontSize:12,display:"flex",gap:5,alignItems:"center",marginBottom:ti<trts.length-1?3:0}}>
                            <span style={{background:"#f0f7f0",color:"#1a3a1a",borderRadius:5,padding:"1px 7px",fontWeight:600,fontSize:11,maxWidth:140,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",display:"block"}}>
                              {t.medicament||"—"}
                            </span>
                            {t.voieAdmin&&<span style={{background:"#f3e5f5",color:"#6a1b9a",borderRadius:4,padding:"1px 5px",fontSize:10,whiteSpace:"nowrap",flexShrink:0}}>{t.voieAdmin}</span>}
                          </div>
                        ))}
                      </td>
                      <td style={{padding:"9px 11px",color:"#1565c0",fontWeight:700,whiteSpace:"nowrap",fontSize:12}}>
                        {dateAttenteL?<>{joursAttenteL}j<br/><span style={{fontWeight:400}}>{formatDate(dateAttenteL)}</span></>:"—"}
                      </td>
                      <td style={{padding:"9px 11px",color:"#b71c1c",fontWeight:700,whiteSpace:"nowrap",fontSize:12}}>
                        {dateAttenteV?<>{joursAttenteV}j<br/><span style={{fontWeight:400}}>{formatDate(dateAttenteV)}</span></>:"—"}
                      </td>
                      <td style={{padding:"9px 11px"}}><StatusBadge record={r}/></td>
                      <td style={{padding:"9px 7px"}}>
                        <div style={{display:"flex",gap:4}}>
                          <button onClick={e=>{e.stopPropagation();isGroup?handleEditGroup(g):handleEdit(r);}} style={{padding:"3px 8px",borderRadius:6,border:"1px solid #c8e6c9",background:"#f1f8e9",color:"#2d5a27",cursor:"pointer",fontWeight:700,fontSize:12}}>✎</button>
                          <button onClick={e=>{e.stopPropagation();setConfirmDelete(isGroup?g.map(x=>x.id):r.id);}} style={{padding:"3px 8px",borderRadius:6,border:"1px solid #ffcdd2",background:"#fff8f8",color:"#c62828",cursor:"pointer",fontWeight:700,fontSize:12}}>🗑</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
        <div style={{marginTop:24,textAlign:"center",color:"#8aaa8a",fontSize:10,fontFamily:"sans-serif",letterSpacing:1}}>
          CARNET SANITAIRE BOVIN LAIT — Conforme réglementation française — {vaches.length} animaux
        </div>
      </div>
    </div>
  );
}

const { useState, useMemo, useRef, useEffect } = React;
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
